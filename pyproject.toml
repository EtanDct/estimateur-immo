[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estimateur-immo"
version = "0.1.0"
description = "Estimation du prix d'un bien dans les dix plus grandes villes de France, à partir des ventes DVF."
readme = "README.md"
requires-python = ">=3.12"
# Les versions exactes testées sont dans requirements.txt (développement) et requirements-api.txt (API).
dependencies = [
    "pandas>=3.0",
    "numpy>=2.5",
    "scikit-learn>=1.9",
    "joblib>=1.6",
    "matplotlib>=3.11",
    "fastapi>=0.151",
    "uvicorn>=0.54",
    "slowapi>=0.1.10",
]

[project.scripts]
estimateur = "estimateur.cli:main"

[tool.setuptools.packages.find]
include = ["estimateur*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La racine du projet dans le chemin de Python : « pytest » trouve estimateur/ sans installation préalable.
pythonpath = ["."]
filterwarnings = [
    # slowapi (bibliothèque tierce) utilise une fonction qui disparaîtra de Python 3.16 : rien à corriger chez nous.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
]

[tool.ruff]
# Le code garde ses commentaires et ses messages sur une seule ligne : 160 caractères.
line-length = 160
# tests/ est cherché comme le projet : « from conftest import ... » y est un import local, pas une bibliothèque.
src = [".", "tests"]

[tool.ruff.lint]
# E et F : erreurs de syntaxe, imports ou variables inutilisés. I : imports triés. B : pièges courants.
select = ["E", "F", "I", "B"]
